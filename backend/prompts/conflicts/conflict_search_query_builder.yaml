id: conflicts.search_query_builder
version: "1.0.0"
description: >
  Строит набор поисковых запросов для поиска конфликтующих обозначений в базе
  Роспатента. Генерирует точные, нечёткие, фонетические, транслитерационные
  и семантические варианты запросов.

system: |
  Ты — специалист по поиску товарных знаков в базе данных ФИПС (Роспатент).
  Твоя задача — сформировать исчерпывающий набор поисковых запросов, которые
  покроют все варианты сходных обозначений.

  Стратегии поиска:

  1. ТОЧНЫЙ ПОИСК (exact):
     - Дословное совпадение обозначения
     - С артиклями/без артиклей, с пробелами/без

  2. НЕЧЁТКИЙ ПОИСК (fuzzy):
     - Опечатки (1-2 символа)
     - Перестановки букв
     - Пропущенные/лишние символы

  3. ФОНЕТИЧЕСКИЙ ПОИСК (phonetic):
     - Звучание при произношении вслух
     - Замена фонетически схожих букв: В/Ф, Б/П, Г/К, Д/Т, З/С, Ж/Ш
     - Схожесть гласных звуков
     - Русские правила фонетической редукции

  4. ТРАНСЛИТЕРАЦИЯ (transliteration):
     - Кириллица → латиница (ГОСТ 7.79-2000, ISO 9)
     - Латиница → кириллица
     - Неформальная транслитерация (как пишут в интернете)

  5. СЕМАНТИЧЕСКИЙ ПОИСК (semantic):
     - Синонимы и близкие по смыслу слова
     - Связанные тематические понятия
     - Переводы на английский/другие языки

  Отвечай ТОЛЬКО валидным JSON.

user_template: |
  Сформируй поисковые запросы для товарного знака.

  ## Заявленное обозначение:
  - Текст: {{ mark_text }}
  - Вид: {{ mark_type }}
  - Язык: {{ mark_language | default('ru') }}

  ## Классы МКТУ для поиска:
  {{ classes | join(', ') }}

  {% if transliteration_hint is defined %}
  ## Подсказка по транслитерации: {{ transliteration_hint }}
  {% endif %}

  {% if semantic_domain is defined %}
  ## Семантическая область: {{ semantic_domain }}
  {% endif %}

  {% if search_depth is defined %}
  ## Глубина поиска: {{ search_depth }}
  {% endif %}

  Сформируй все необходимые варианты поисковых запросов по всем стратегиям.

input_schema:
  type: object
  required:
    - mark_text
    - mark_type
    - classes
  properties:
    mark_text:
      type: string
    mark_type:
      type: string
      enum: [словесное, изобразительное, комбинированное, объёмное, звуковое, позиционное]
    mark_language:
      type: string
      description: Язык обозначения (ru/en/mixed)
      default: "ru"
    classes:
      type: array
      items:
        type: integer
    transliteration_hint:
      type: string
      description: Подсказка по предпочтительной транслитерации
    semantic_domain:
      type: string
      description: Семантическая область обозначения (например, "финансы", "еда")
    search_depth:
      type: string
      enum: [minimal, standard, comprehensive]
      default: standard

output_schema:
  type: object
  required:
    - queries
    - suggested_classes
    - search_strategy
  properties:
    queries:
      type: array
      items:
        type: object
        required:
          - type
          - value
          - description
        properties:
          type:
            type: string
            enum: [exact, fuzzy, phonetic, transliteration, semantic]
          value:
            type: string
            description: Поисковый запрос
          description:
            type: string
            description: Пояснение запроса на русском языке
          confidence:
            type: number
            minimum: 0
            maximum: 1
            description: Уверенность в релевантности этого варианта
    suggested_classes:
      type: array
      items:
        type: integer
      description: Рекомендуемые классы для поиска (может включать смежные)
    search_strategy:
      type: string
      enum: [minimal, standard, comprehensive]
    total_queries:
      type: integer

examples:
  - input:
      mark_text: "СБЕРБАНК"
      mark_type: "словесное"
      classes: [36]
      search_depth: "comprehensive"
    output:
      queries:
        - type: "exact"
          value: "СБЕРБАНК"
          description: "Точное совпадение"
          confidence: 1.0
        - type: "fuzzy"
          value: "СБEРБАНК"
          description: "Замена буквы Е на Ё"
          confidence: 0.85
        - type: "fuzzy"
          value: "СБЕРБАН"
          description: "Усечение последнего символа"
          confidence: 0.75
        - type: "phonetic"
          value: "ЗБЕРПАНК"
          description: "Фонетическая замена: С→З, Б→П"
          confidence: 0.60
        - type: "transliteration"
          value: "SBERBANK"
          description: "Транслитерация на латиницу (ISO 9)"
          confidence: 0.90
        - type: "transliteration"
          value: "СБЕРБАНК"
          description: "Обратная транслитерация — совпадает с оригиналом"
          confidence: 0.95
        - type: "semantic"
          value: "СБЕР"
          description: "Сокращение — официальный ребрендинг Сбербанка"
          confidence: 0.95
        - type: "semantic"
          value: "БАНК СБЕРЕЖЕНИЙ"
          description: "Смысловой эквивалент"
          confidence: 0.50
      suggested_classes: [36, 35, 38]
      search_strategy: "comprehensive"
      total_queries: 8

guardrails:
  - queries должен содержать минимум 3 записи даже для minimal depth
  - Не дублируй одинаковые значения в разных типах
  - transliteration должен включать оба направления (рус→лат и лат→рус)
  - confidence должен объективно отражать вероятность нахождения сходных марок
  - suggested_classes должен включать исходные классы + смежные

evaluation_notes: >
  Проверить: охватывают ли запросы все 5 стратегий? Соответствует ли
  transliteration реальным стандартам (ГОСТ 7.79-2000)? Осмысленны ли
  semantic-варианты? Не завышены ли confidence-оценки для fuzzy-вариантов?
