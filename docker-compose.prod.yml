name: registr

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    logging: *bounded-logs
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    security_opt:
      - no-new-privileges:true

  migrate:
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 64
    logging: *bounded-logs
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FILE_STORAGE_PATH: /data/documents
      ENVIRONMENT: production
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    mem_limit: 1152m
    cpus: 1.25
    pids_limit: 128
    logging: *bounded-logs
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FILE_STORAGE_PATH: /data/documents
      ANALYSIS_WORKER_MODE: external
      ENVIRONMENT: production
      WORKER_HEARTBEAT_PATH: /data/health/worker.json
      GIGACHAT_CA_BUNDLE_FILE: /app/certs/russian_trusted_root_ca_pem.crt
    volumes:
      - documents_data:/data/documents
      - worker_health:/data/health:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose: ["8000"]
    restart: unless-stopped
    networks: [private]
    security_opt:
      - no-new-privileges:true

  worker:
    mem_limit: 640m
    cpus: 1.00
    pids_limit: 128
    logging: *bounded-logs
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      FILE_STORAGE_PATH: /data/documents
      ANALYSIS_WORKER_MODE: external
      ENVIRONMENT: production
      WORKER_HEARTBEAT_PATH: /data/health/worker.json
      GIGACHAT_CA_BUNDLE_FILE: /app/certs/russian_trusted_root_ca_pem.crt
    command: ["python", "-m", "app.workers.full_analysis"]
    volumes:
      - documents_data:/data/documents
      - worker_health:/data/health
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [private]
    security_opt:
      - no-new-privileges:true

  web:
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    logging: *bounded-logs
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      api:
        condition: service_healthy
    expose: ["8080"]
    restart: unless-stopped
    networks: [private]
    security_opt:
      - no-new-privileges:true

  caddy:
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *bounded-logs
    image: caddy:2.8-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]
    security_opt:
      - no-new-privileges:true

networks:
  private:
    driver: bridge

volumes:
  worker_health:
    name: registr_worker_health
  postgres_data:
    name: registr_postgres_data
  documents_data:
    name: registr_documents_data
  caddy_data:
    name: registr_caddy_data
  caddy_config:
    name: registr_caddy_config
