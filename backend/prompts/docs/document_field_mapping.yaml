id: docs.document_field_mapping
version: "1.0.0"
description: >
  Сопоставляет данные заявки с полями документных шаблонов Роспатента.
  Выполняет маппинг, валидацию форматов и генерирует предупреждения
  о неполных или несовместимых данных.

system: |
  Ты — специалист по делопроизводству в области патентного права России.
  Твоя задача — точно сопоставить данные заявки с полями официальных форм Роспатента.

  Документные шаблоны Роспатента (официальные формы):
  - form_заявка_роспатент_2023: Заявление о государственной регистрации товарного знака
  - form_доверенность: Доверенность представителя
  - form_перечень_тиу: Перечень товаров, работ и услуг
  - form_описание_знака: Описание заявленного обозначения

  Форматирование полей:
  - ОГРН: 13 цифр (для юр.лиц), 15 цифр (ИП)
  - ИНН: 10 цифр (юр.лицо), 12 цифр (физ.лицо/ИП)
  - Адрес: по ФИАС или КЛАДР в официальном формате
  - Дата: ДД.ММ.ГГГГ
  - Номер телефона: +7(XXX)XXX-XX-XX

  При маппинге:
  1. Сохраняй исходные значения там, где маппинг однозначен
  2. Нормализуй форматы (дата, телефон, адрес) автоматически
  3. Отмечай поля, где нормализация невозможна без дополнительных данных
  4. Генерируй предупреждения для подозрительных значений

  Отвечай ТОЛЬКО валидным JSON.

user_template: |
  Выполни маппинг данных заявки на поля шаблона документа.

  ## Шаблон документа: {{ template_id }}

  ## Данные заявки:
  ```json
  {{ application_data | tojson(indent=2) }}
  ```

  ## Поля шаблона:
  ```json
  {{ template_fields | tojson(indent=2) }}
  ```

  {% if strict_mode is defined and strict_mode %}
  Режим строгой проверки: отмечай любые несоответствия форматов.
  {% endif %}

  Выполни полный маппинг и проверь корректность форматов всех полей.

input_schema:
  type: object
  required:
    - template_id
    - application_data
    - template_fields
  properties:
    template_id:
      type: string
      description: Идентификатор шаблона документа
    application_data:
      type: object
      description: Данные заявки
    template_fields:
      type: array
      items:
        type: object
        properties:
          field_name:
            type: string
          field_label:
            type: string
          required:
            type: boolean
          format:
            type: string
      description: Список полей шаблона с метаданными
    strict_mode:
      type: boolean
      default: false

output_schema:
  type: object
  required:
    - mapped_fields
    - unmapped_fields
    - template_id
    - confidence
  properties:
    mapped_fields:
      type: object
      description: "Словарь {имя_поля: значение} успешно сопоставленных полей"
    unmapped_fields:
      type: array
      items:
        type: string
      description: Поля, для которых не найдены данные в заявке
    template_id:
      type: string
    confidence:
      type: number
      minimum: 0
      maximum: 1
    warnings:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          warning:
            type: string
          severity:
            type: string
            enum: [info, warning, error]
    format_corrections:
      type: object
      description: "Поля, в которых формат был нормализован: {original, normalized}"
    missing_required_fields:
      type: array
      items:
        type: string
      description: Обязательные поля, которые не были заполнены
    document_ready:
      type: boolean
      description: Готов ли документ к генерации

examples:
  - input:
      template_id: "form_заявка_роспатент_2023"
      application_data:
        applicant:
          org_name: "ООО «Пример»"
          inn: "7712345678"
          ogrn: "1234567890123"
          address: "119991 Москва ул Ленина 1"
          phone: "84951234567"
          email: "info@primer.ru"
        mark:
          text: "ПРИМЕР"
          type: "словесное"
        classes: [35, 42]
        goods_services_description: "Услуги рекламы; разработка ПО"
      template_fields:
        - field_name: "заявитель_наименование"
          field_label: "Полное наименование заявителя"
          required: true
          format: "string"
        - field_name: "заявитель_инн"
          field_label: "ИНН"
          required: true
          format: "inn"
        - field_name: "заявитель_огрн"
          field_label: "ОГРН"
          required: true
          format: "ogrn"
        - field_name: "заявитель_адрес"
          field_label: "Адрес для переписки"
          required: true
          format: "address"
        - field_name: "заявитель_телефон"
          field_label: "Телефон"
          required: false
          format: "phone_ru"
        - field_name: "обозначение_текст"
          field_label: "Текст обозначения"
          required: true
          format: "string"
        - field_name: "мкту_классы"
          field_label: "Классы МКТУ"
          required: true
          format: "classes_list"
        - field_name: "заявитель_представитель"
          field_label: "Имя представителя (патентного поверенного)"
          required: false
          format: "string"
    output:
      mapped_fields:
        заявитель_наименование: "ООО «Пример»"
        заявитель_инн: "7712345678"
        заявитель_огрн: "1234567890123"
        заявитель_адрес: "119991, г. Москва, ул. Ленина, д. 1"
        заявитель_телефон: "+7(495)123-45-67"
        обозначение_текст: "ПРИМЕР"
        мкту_классы: "35, 42"
      unmapped_fields:
        - "заявитель_представитель"
      template_id: "form_заявка_роспатент_2023"
      confidence: 0.96
      warnings:
        - field: "заявитель_адрес"
          warning: "Адрес нормализован из неформатированной строки — рекомендуется проверка по ФИАС"
          severity: "warning"
        - field: "заявитель_телефон"
          warning: "Номер телефона нормализован из формата 8-XXX"
          severity: "info"
      format_corrections:
        заявитель_адрес:
          original: "119991 Москва ул Ленина 1"
          normalized: "119991, г. Москва, ул. Ленина, д. 1"
        заявитель_телефон:
          original: "84951234567"
          normalized: "+7(495)123-45-67"
      missing_required_fields: []
      document_ready: true

guardrails:
  - ИНН юр.лица всегда 10 цифр, ИП — 12 цифр
  - ОГРН юр.лица всегда 13 цифр, ИП (ОГРНИП) — 15 цифр
  - document_ready = false если missing_required_fields непустой
  - warnings должны содержать severity
  - Не изменяй семантику данных при нормализации, только формат

evaluation_notes: >
  Проверить: все ли обязательные поля покрыты маппингом? Корректны ли
  format_corrections (не меняется смысл данных)? Логична ли логика
  document_ready? Предупреждения адекватны ситуации?
