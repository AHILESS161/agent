[pytest]
# ---------------------------------------------------------------------------
# pytest configuration for the Trademark Registration System backend
# ---------------------------------------------------------------------------

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode for FastAPI/SQLAlchemy async tests
asyncio_mode = auto

# Markers
markers =
    unit: Pure unit tests with no external dependencies
    api: API integration tests using the TestClient
    e2e: End-to-end tests simulating full user workflows
    slow: Tests that take more than 2 seconds
    requires_llm: Tests that require a real LLM provider (skipped in CI)

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Logging during tests
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s %(levelname)s %(name)s: %(message)s
log_date_format = %H:%M:%S
